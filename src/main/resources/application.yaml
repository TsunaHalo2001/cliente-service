# ═══════════════════════════════════════════════════════════
# INFORMACIÓN DE LA APLICACIÓN
# ═══════════════════════════════════════════════════════════
app:
  version: 0.2.0

api:
  version: v1

# ═══════════════════════════════════════════════════════════
# SERVIDOR WEB
# ═══════════════════════════════════════════════════════════
server:
  port: 8080

# ═══════════════════════════════════════════════════════════
# CONFIGURACIÓN DE SPRING
# ═══════════════════════════════════════════════════════════
spring:
  application:
    name: cliente-service

  # ── BASE DE DATOS Y POOL (PostgreSQL / HikariCP) ─────────
  datasource:
    url: jdbc:postgresql://localhost:5432/curso_springboot
    username: devdb
    password: a1b2c3d4
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ClienteHikariPool
      initialization-fail-timeout: -1
      keepalive-time: 300000
      validation-timeout: 5000

  # ── JPA / HIBERNATE ───────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── CARGA DE ARCHIVOS (fotos de perfil) ───────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ═══════════════════════════════════════════════════════════
# SPRING ACTUATOR
# ═══════════════════════════════════════════════════════════
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# ═══════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════
logging:
  level:
    com.denkitronik.clienteservice: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE